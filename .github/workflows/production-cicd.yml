name: Production CI/CD

on:
  push:
    branches:
      - production
  workflow_dispatch:

# Fix 4: Không cho 2 deploy chạy song song trên cùng 1 server
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: kdisme/quanly-backend
  FRONTEND_IMAGE: kdisme/quanly-frontend
  DEPLOY_PATH: /opt/quanly-trungtam
  PRODUCTION_URL: http://160.25.166.147

jobs:
  ci:
    name: CI - Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fix 5: Cache Docker layer theo GitHub Actions cache — tăng tốc các lần build sau
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:production
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:production
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: CD - Deploy to server
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: mkdir -p /opt/quanly-trungtam

      - name: Copy compose file and schema to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: docker-compose.prod.yml,QLTTNN.sql
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          PORT: 3001
          DB_NAME: QLTTNN
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 7d
          FRONTEND_URL: ${{ env.PRODUCTION_URL }}
          DEFAULT_TENANT_SLUG: demo
          DEFAULT_TENANT_NAME: Demo English Center
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,PORT,DB_NAME,DB_USER,DB_PASSWORD,JWT_SECRET,JWT_EXPIRES_IN,FRONTEND_URL,DEFAULT_TENANT_SLUG,DEFAULT_TENANT_NAME
          script: |
            set -e
            mkdir -p /opt/quanly-trungtam
            cd /opt/quanly-trungtam

            # Fix 3: Lưu image hiện tại để rollback nếu deploy mới thất bại
            ROLLBACK_BACKEND=$(grep '^BACKEND_IMAGE=' .env.production 2>/dev/null | cut -d= -f2 || echo "")
            ROLLBACK_FRONTEND=$(grep '^FRONTEND_IMAGE=' .env.production 2>/dev/null | cut -d= -f2 || echo "")

            cat > .env.production <<EOF
            BACKEND_IMAGE=${BACKEND_IMAGE}
            FRONTEND_IMAGE=${FRONTEND_IMAGE}
            PORT=${PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
            FRONTEND_URL=${FRONTEND_URL}
            DEFAULT_TENANT_SLUG=${DEFAULT_TENANT_SLUG}
            DEFAULT_TENANT_NAME=${DEFAULT_TENANT_NAME}
            EOF

            docker compose --env-file .env.production -f docker-compose.prod.yml pull

            # Khởi động postgres trước, chờ sẵn sàng
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
            for i in $(seq 1 30); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres pg_isready -U ${DB_USER} -d ${DB_NAME} > /dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # Import base schema nếu chưa có (lần deploy đầu tiên)
            TABLE_EXISTS=$(docker compose --env-file .env.production -f docker-compose.prod.yml exec -T postgres \
              psql -U ${DB_USER} -d ${DB_NAME} -tAc \
              "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='tenants');" \
              2>/dev/null || echo "f")
            if [ "$TABLE_EXISTS" != "t" ]; then
              echo "📦 Importing base schema (first deploy)..."
              docker cp /opt/quanly-trungtam/QLTTNN.sql quanly-postgres:/tmp/QLTTNN.sql
              docker exec quanly-postgres psql -U ${DB_USER} -d ${DB_NAME} -f /tmp/QLTTNN.sql
              echo "✅ Base schema imported"
            else
              echo "✅ Schema already exists, skipping import"
            fi

            # Fix 8: Backup DB trước khi chạy migration
            echo "💾 Backing up database before migration..."
            mkdir -p /opt/quanly-trungtam/backups
            BACKUP_FILE="/opt/quanly-trungtam/backups/backup_$(date +%Y%m%d_%H%M%S).sql"
            docker exec quanly-postgres pg_dump -U ${DB_USER} ${DB_NAME} > "${BACKUP_FILE}"
            echo "✅ Database backed up to ${BACKUP_FILE}"
            # Giữ tối đa 5 bản backup gần nhất
            ls -t /opt/quanly-trungtam/backups/*.sql 2>/dev/null | tail -n +6 | xargs rm -f || true

            # Khởi động toàn bộ services
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d

            # Chạy homework migration
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend npm run migrate

            # Fix 3: Health check với rollback tự động nếu thất bại
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/health > /dev/null; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Health check failed!"
              if [ -n "$ROLLBACK_BACKEND" ]; then
                echo "🔄 Rolling back to: ${ROLLBACK_BACKEND}..."
                sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=${ROLLBACK_BACKEND}|" .env.production
                sed -i "s|FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${ROLLBACK_FRONTEND}|" .env.production
                docker compose --env-file .env.production -f docker-compose.prod.yml up -d
                echo "✅ Rollback complete"
              else
                echo "⚠️  No previous version to rollback to"
              fi
              docker compose --env-file .env.production -f docker-compose.prod.yml ps
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=120 backend
              exit 1
            fi


  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs:
      - ci
      - docker
      - deploy
    if: always()
    steps:
      - name: Build notification message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "${{ needs.ci.result }}" != "success" ]; then STATUS="${{ needs.ci.result }}"; fi
          if [ "${{ needs.docker.result }}" != "success" ]; then STATUS="${{ needs.docker.result }}"; fi

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          CI_RESULT="${{ needs.ci.result }}"
          DOCKER_RESULT="${{ needs.docker.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          PROD_URL="${{ env.PRODUCTION_URL }}"
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            TITLE="[OK] Deploy production thanh cong"
            DETAIL="Production da duoc cap nhat va health check thanh cong."
            MESSAGE=$(printf "%s\n\nRepo: %s\nBranch: %s\nCommit: %s\nAuthor: %s\nCI: %s\nDocker: %s\nDeploy: %s\nURL: %s\nLogs: %s\n\n%s" \
              "$TITLE" "$REPO" "$BRANCH" "$COMMIT" "$ACTOR" \
              "$CI_RESULT" "$DOCKER_RESULT" "$DEPLOY_RESULT" \
              "$PROD_URL" "$LOGS_URL" "$DETAIL")
          else
            TITLE="[FAIL] CI/CD production that bai"
            gh run view "${{ github.run_id }}" --log-failed > failed.log 2>/dev/null || true
            if [ -s failed.log ]; then
              DETAIL="$(tail -c 2600 failed.log)"
            else
              DETAIL="Khong lay duoc log tu GitHub CLI. Hay mo link Logs ben duoi de xem chi tiet."
            fi
            MESSAGE=$(printf "%s\n\nRepo: %s\nBranch: %s\nCommit: %s\nAuthor: %s\nCI: %s\nDocker: %s\nDeploy: %s\nLogs: %s\n\nLog loi gan nhat:\n%s" \
              "$TITLE" "$REPO" "$BRANCH" "$COMMIT" "$ACTOR" \
              "$CI_RESULT" "$DOCKER_RESULT" "$DEPLOY_RESULT" \
              "$LOGS_URL" "$DETAIL")
          fi

          {
            echo "MESSAGE<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"
